# Spring AI / Embabel LLM Configuration
# All LLM settings can be configured via environment variables
# See docker-compose.yml for default values
spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:not-set}
      base-url: ${SPRING_AI_OPENAI_BASE_URL:https://openrouter.ai/api/v1}
      chat:
        options:
          model: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:openai/gpt-4o-mini}
          temperature: ${SPRING_AI_OPENAI_CHAT_OPTIONS_TEMPERATURE:0.3}

# Embabel Model Configuration (NOTE: embabel.models NOT embabel.agent!)
embabel:
  models:
    default-llm: ${EMBABEL_MODELS_DEFAULT_LLM:gpt-4.1-mini}
    llms:
      default: gpt-4.1-mini
      cheap: gpt-5-nano
      best: gpt-5

# Environment-based configuration keys
homeassistant:
  base-url: http://home-assistant:8123
  access-token: ${HOME_ASSISTANT_LONG_LIVED_ACCES_TOKEN:test-dummy-token-12345}

# Employee to WLED segment mapping
employee-led:
  mappings:
    "John Doe":
      entity-id: light.wled_segment_0
      color: "#00FF00"  # Green
      brightness: 255
    "Jane Doe":
      entity-id: light.wled_segment_1
      color: "#0000FF"  # Blue
      brightness: 200
    "Alice Smith":
      entity-id: light.wled_segment_2
      color: "#FF00FF"  # Magenta
      brightness: 220
    "Bob Johnson":
      entity-id: light.wled_segment_3
      color: "#FFFF00"  # Yellow
      brightness: 255

# Employee to device tracker mapping
# Maps employee names to their device_tracker entity IDs in Home Assistant
employee-device:
  use-mock-data: true  # Set to false to use real device tracker data
  mappings:
    "John Doe":
      - device_tracker.john_phone
      - device_tracker.john_laptop
    "Jane Doe":
      - device_tracker.jane_phone
    "Alice Smith":
      - device_tracker.alice_phone
      - device_tracker.alice_laptop
    "Bob Johnson":
      - device_tracker.bob_phone
    "Wim de Kok":
      - device_tracker.wim_phone
      - device_tracker.wim_laptop

