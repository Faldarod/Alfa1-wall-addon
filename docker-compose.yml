version: '3.8'
services:
  alfa-wall-addon:
    build: ./alfa-wall-addon
    environment:
      # LLM Configuration - All can be overridden via environment variables
      # Get your OpenRouter API key at: https://openrouter.ai/keys
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SPRING_AI_OPENAI_BASE_URL=${SPRING_AI_OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      - SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL=${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:-openai/gpt-4o-mini}
      - SPRING_AI_OPENAI_CHAT_OPTIONS_TEMPERATURE=${SPRING_AI_OPENAI_CHAT_OPTIONS_TEMPERATURE:-0.7}
      - EMBABEL_MODELS_DEFAULT_LLM=${EMBABEL_MODELS_DEFAULT_LLM:-gpt-4.1-mini}
    ports:
      - "8080:8080"

  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    profiles:
      - local-testing
    volumes:
      - ./home-assistant/config:/config
    ports:
      - "8123:8123"
    depends_on:
      - unifi-controller

  wled-simulator:
    build: ./wled-simulator
    profiles:
      - local-testing
    environment:
      - SERVER_PORT=80
    ports:
      - "8081:80"

  unifi-controller:
    image: lscr.io/linuxserver/unifi-network-application:latest
    container_name: unifi-controller
    profiles:
      - local-testing
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
      - MONGO_USER=unifi
      - MONGO_PASS=unifi
      - MONGO_HOST=unifi-db
      - MONGO_PORT=27017
      - MONGO_DBNAME=unifi
    volumes:
      - ./unifi/unifi-data:/config
    ports:
      - "8443:8443"   # Web interface (HTTPS)
      - "3478:3478/udp"  # STUN port
      - "10001:10001/udp"  # Device discovery
      - "8082:8080"   # Device communication (mapped to 8082 to avoid conflict)
      - "1900:1900/udp"  # L2 discovery
      - "8843:8843"   # Guest portal HTTPS
      - "8880:8880"   # Guest portal HTTP
      - "6789:6789"   # Mobile throughput test
    restart: unless-stopped
    depends_on:
      - unifi-db

  unifi-db:
    image: mongo:4.4
    container_name: unifi-db
    profiles:
      - local-testing
    environment:
      - MONGO_INITDB_ROOT_USERNAME=unifi
      - MONGO_INITDB_ROOT_PASSWORD=unifi
      - MONGO_INITDB_DATABASE=unifi
    volumes:
      - ./unifi/unifi-db-data:/data/db
      - ./unifi/mongo-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
